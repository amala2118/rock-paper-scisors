<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <p>Choose your move!</p>

    <div class="buttons">
        <button id="rock">✊ Rock</button>
        <button id="paper">✋ Paper</button>
        <button id="scissors">✌️ Scissors</button>
    </div>

    <div id="results">
        <p id="player-choice">Your choice: </p>
        <p id="computer-choice">Computer choice: </p>
        <h2 id="result">Let's play!</h2>
    </div>

    <div id="score">
        <p>Player: <span id="player-score">0</span></p>
        <p>Computer: <span id="computer-score">0</span></p>
    </div>

    <button id="restart">Restart Game</button>

</body>
</html>
